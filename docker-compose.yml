version: '3.8'

services:
  # Backend - Spring Boot API
  backend:
    image: jossuetorres/as232s5_aej_14-be:latest
    container_name: backend-app
    ports:
      - "${BACKEND_PORT:-8085}:8085"
    environment:
      - PORT=8085
      - SERVER_URL=http://localhost:${BACKEND_PORT:-8085}
      - SPRING_R2DBC_URL=r2dbc:postgresql://ep-spring-mode-a839f09f-pooler.eastus2.azure.neon.tech/chat_messages?ssl=true
      - SPRING_R2DBC_USERNAME=neondb_owner
      - SPRING_R2DBC_PASSWORD=npg_IJdQEZuF4BN3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/api/chat-messages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Frontend - React
  frontend:
    image: jossuetorres/as232s5_aej_14-fe:latest
    container_name: frontend-app
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_URL=https://friendly-giggle-gwg4gg4p9w3v5v-9090.app.github.dev
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

# Definición de redes
networks:
  app-network:
    driver: bridge

# ============================================
# 📌 SERVICIOS DISPONIBLES
# ============================================
#
# Frontend: http://localhost:3000
# Backend API: http://localhost:8085
#
# Endpoints GET del Backend:
# - GET http://localhost:8085/api/chat-messages
# - GET http://localhost:8085/api/age-detection
# - GET http://localhost:8085/swagger-ui.html
#
# ============================================
# 🔧 COMANDOS
# ============================================
#
# Levantar ambos servicios:
#   docker compose up -d
#
# Ver logs:
#   docker compose logs -f
#   docker compose logs -f backend
#   docker compose logs -f frontend
#
# Detener:
#   docker compose down
#
# Cambiar puertos:
#   $env:BACKEND_PORT=9090
#   $env:FRONTEND_PORT=4000
#   docker compose up -d
# ============================================
